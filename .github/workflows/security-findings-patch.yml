name: Security findings patch

on:
  push:
    branches:
      - hardening/security-findings-2026-09

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server and customer pagination
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('server.ts')
          text = server.read_text()

          if "from './src/server/auth.ts'" not in text:
              text = text.replace(
                  "import { messageLogs } from './src/db/schema.ts';",
                  "import { messageLogs } from './src/db/schema.ts';\nimport { authRequired } from './src/server/auth.ts';",
                  1,
              )

          mount = "  app.use(express.json({ limit: '50mb' }));\n  app.use('/api', dbApiRouter);"
          secure_mount = """  app.use(express.json({ limit: '50mb' }));

  app.use('/api', (req, res, next) => {
    const publicPath = req.path.startsWith('/auth/') || req.path.startsWith('/webhook/');
    if (publicPath) return next();
    return authRequired(req, res, next);
  });
  app.use('/api', dbApiRouter);"""
          if mount in text:
              text = text.replace(mount, secure_mount, 1)

          old = """  app.get('/api/bot/connected-users', (req, res) => {
    res.json({
      success: true,
      users: botUsers.slice(0, 50)
    });
  });"""
          new = """  app.get('/api/bot/connected-users', (req, res) => {
    const requestedLimit = Number(req.query.limit);
    const limit = Number.isFinite(requestedLimit) && requestedLimit > 0 ? Math.min(Math.floor(requestedLimit), 5000) : botUsers.length;
    const offset = Math.max(0, Number(req.query.offset) || 0);
    res.json({ success: true, total: botUsers.length, offset, limit, users: botUsers.slice(offset, offset + limit) });
  });"""
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace(
              "  const matchedByIdAny = botUsers.find(u => u.chatId === cleaned);\n  const matchedById = matchedByIdPlatform || matchedByIdAny;",
              "  const matchedById = matchedByIdPlatform;",
              1,
          )
          text = text.replace("    if (!matchedByUsername) {\n      matchedByUsername = findUserByUsername(withoutAt);\n    }\n", "", 1)
          text = text.replace("    if (!matchedByPhone) {\n      matchedByPhone = findUserByPhone(normPhone);\n    }\n", "", 1)

          text = text.replace(
              "    if (provider === 'none' || !provider || !token) {\n      console.log(`Simulated SMS to ${phone}:`, message);\n      isSimulated = true;\n    }",
              "    if (provider === 'none' || !provider || !token) {\n      return res.status(503).json({ success: false, simulated: false, error: 'سرویس پیامک تنظیم نشده است؛ پیامکی ارسال نشد.' });\n    }",
              1,
          )
          server.write_text(text)

          customers = Path('src/pages/Customers.tsx')
          ctext = customers.read_text()
          ctext = ctext.replace(
              "  }, [search, statusFilter]);",
              "  }, [search, statusFilter, minAmount, maxAmount, fromDate, toDate]);",
              1,
          )
          customers.write_text(ctext)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts src/pages/Customers.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden server APIs and customer advanced filters'
          git push
