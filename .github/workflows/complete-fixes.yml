name: Complete repository fixes
on:
  push:
    branches:
      - fix/contracts-sms-pagination-20260908
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source
        run: |
          python <<'PY'
          from pathlib import Path
          import re, textwrap
          wf = Path('.github/workflows/apply-contract-fixes.yml').read_text(encoding='utf-8')
          script = textwrap.dedent(wf.split("python <<'PY'\n", 1)[1].split('\n          PY', 1)[0])
          script = re.sub(
              r'sms_re = re\\.compile\\(r".*?"\\)',
              lambda _: 'sms_re = re.compile(r"  // API Route: Send SMS \\(Mock/Real\\)[\\s\\S]*?(?=\\n\\s*app\\.post\\(|\\n\\s*app\\.get\\(|\\Z)")',
              script,
              count=1,
          )
          exec(compile(script, 'patcher.py', 'exec'), {})
          p = Path('src/pages/Contracts.tsx')
          s = p.read_text(encoding='utf-8')
          if 'const executeRenewal = async () =>' in s and s.count('const sendAutoSms = async (contract: Partial<Contract>) =>') == 1:
              a = s.find('  const sendAutoSms = async (contract: Partial<Contract>) => {')
              b = s.find('\n  };', a) + len('\n  };')
              helper = s[a:b]
              h = s.find('  const handleSave = async () => {')
              s = s[:h] + helper + '\n\n' + s[h:]
              s = s[:a] + s[b:]
              p.write_text(s, encoding='utf-8')
          PY
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .patch-trigger .patch-trigger2 .finalize-trigger .complete-trigger
          git rm -f .github/workflows/apply-contract-fixes.yml .github/workflows/finish-contract-fixes.yml .github/workflows/finalize-contract-fixes.yml .github/workflows/complete-fixes.yml
          git add src/pages/Contracts.tsx src/pages/Customers.tsx src/pages/Settings.tsx server.ts patch_welcome*.cjs 2>/dev/null || true
          git commit -m "fix: contracts pagination customers bulk actions and SMS delivery"
          git push origin HEAD:fix/contracts-sms-pagination-20260908
